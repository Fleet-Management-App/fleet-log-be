<text x="384.0" y="708.5" font-size="13" fill="#0f172a" text-anchor="middle">Any check hit?</text>
<rect x="412.0" y="653.0" width="50" height="18" rx="4" fill="#b91c1c"/>
<text x="437.0" y="666.0" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="Consolas, monospace">BR-11</text>
