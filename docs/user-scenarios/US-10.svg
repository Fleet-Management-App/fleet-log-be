<circle cx="624.0" cy="704.0" r="8" fill="#0f172a"/>
<text x="624.0" y="734.5" font-size="13" fill="#475569" text-anchor="middle">No flag (gap within 10 km</text>
<text x="624.0" y="751.5" font-size="13" fill="#475569" text-anchor="middle">is fine)</text>
<rect x="286.0" y="786.0" width="196" height="56" rx="22" fill="#e2e8f0" stroke="#475569" stroke-width="2.2"/>
<text x="384.0" y="810.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Anomaly flag created</text>
<text x="384.0" y="827.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">(warning)</text>
<rect x="766.0" y="882.0" width="196" height="56" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.6"/>
<text x="864.0" y="906.0" font-size="13" fill="#0f172a" text-anchor="middle">Open the list of open</text>
<text x="864.0" y="923.0" font-size="13" fill="#0f172a" text-anchor="middle">anomalies</text>
<rect x="766.0" y="978.0" width="196" height="56" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.6"/>
<text x="864.0" y="1002.0" font-size="13" fill="#0f172a" text-anchor="middle">Review the flagged record</text>
<text x="864.0" y="1019.0" font-size="13" fill="#0f172a" text-anchor="middle">and follow up</text>
<circle cx="864.0" cy="1088.0" r="13" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<circle cx="864.0" cy="1088.0" r="8" fill="#0f172a"/>
<text x="24" y="1168" font-size="13" font-weight="700" fill="#0f172a">Business rules (02. Business Rules &amp; Validations)</text>
<text x="24" y="1186" font-size="12" font-weight="700" fill="#b91c1c" font-family="Consolas, monospace">BR-10</text>
<text x="84" y="1186" font-size="12" fill="#334155">The trip-gap check is odometer-based, not time-based</text>
<text x="24" y="1204" font-size="12" font-weight="700" fill="#b91c1c" font-family="Consolas, monospace">BR-11</text>
<text x="84" y="1204" font-size="12" fill="#334155">Up to 10 km odometer gap between trips is tolerated (configurable by Fleet Manager)</text>
