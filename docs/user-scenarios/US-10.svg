<rect x="46.0" y="232.0" width="196" height="56" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<text x="144.0" y="256.0" font-size="13" fill="#0f172a" text-anchor="middle">Save a trip or fuel log</text>
<text x="144.0" y="273.0" font-size="13" fill="#0f172a" text-anchor="middle">(US-02)</text>
<rect x="286.0" y="328.0" width="196" height="56" rx="22" fill="#e2e8f0" stroke="#475569" stroke-width="2.2"/>
<text x="384.0" y="352.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Record saved: a flag</text>
<text x="384.0" y="369.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">never blocks saving</text>
<rect x="286.0" y="424.0" width="196" height="198" rx="10" fill="#fff" stroke="#475569" stroke-width="1.6"/>
<text x="298.0" y="454.0" font-size="13" fill="#0f172a" text-anchor="start">Run checks:</text>
<text x="298.0" y="471.0" font-size="13" fill="#0f172a" text-anchor="start">• odometer goes backwards</text>
<text x="298.0" y="488.0" font-size="13" fill="#0f172a" text-anchor="start">• gap to previous trip &gt;</text>
<text x="298.0" y="505.0" font-size="13" fill="#0f172a" text-anchor="start">10 km</text>
<text x="298.0" y="522.0" font-size="13" fill="#0f172a" text-anchor="start">• trips overlap on a</text>
<text x="298.0" y="539.0" font-size="13" fill="#0f172a" text-anchor="start">vehicle</text>
<text x="298.0" y="556.0" font-size="13" fill="#0f172a" text-anchor="start">• driver on two trips at</text>
<text x="298.0" y="573.0" font-size="13" fill="#0f172a" text-anchor="start">once</text>
<text x="298.0" y="590.0" font-size="13" fill="#0f172a" text-anchor="start">• vehicle in service,</text>
<text x="298.0" y="607.0" font-size="13" fill="#0f172a" text-anchor="start">suspended or STK expired</text>
<rect x="426.0" y="415.0" width="50" height="18" rx="4" fill="#b91c1c"/>
<text x="451.0" y="428.0" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="Consolas, monospace">BR-10</text>
