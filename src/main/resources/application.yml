spring:
  application:
    name: fleet-log-be
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/fleet_log}
    username: ${POSTGRES_USERNAME:fleet_log}
    password: ${POSTGRES_PASSWORD:fleet_log}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    # Liquibase 5 sends anonymous usage data by default; FleetLog doesn't report anything
    analytics-enabled: false

fleetlog:
  security:
    # HS256 signing key, at least 32 bytes. The default is for local development only.
    jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes!}
    token-lifetime: ${JWT_LIFETIME:8h}
    # Comma-separated list of origins allowed to call the API from a browser
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180}
  # Demo accounts in every environment (Confluence "Infrastructure, CI/CD & Deployment" → Demo accounts);
  # created on first start, skipped when they already exist (see DemoDataInitializer)
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
